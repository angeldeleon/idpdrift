[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "idpdrift"
version = "0.1.0"
description = "Identity and access drift detection for security teams, across Entra ID and Okta."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Angel De Leon" }]
keywords = [
    "entra", "azure-ad", "okta", "identity", "iam", "security",
    "privileged-access", "conditional-access", "oauth", "detection", "blue-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]

dependencies = [
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/angeldeleon/idpdrift"
Repository = "https://github.com/angeldeleon/idpdrift"
Issues = "https://github.com/angeldeleon/idpdrift/issues"
Changelog = "https://github.com/angeldeleon/idpdrift/blob/main/CHANGELOG.md"

[project.scripts]
idpdrift = "idpdrift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idpdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: tests that make real outbound requests (deselect with -m 'not network')"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "C4", "RET", "SIM"]
ignore = ["E501", "S101", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S311", "S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["src/idpdrift"]
branch = true
